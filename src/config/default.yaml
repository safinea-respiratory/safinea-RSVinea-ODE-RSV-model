  "1-2m":   "0-3m"
  "2-3m":   "0-3m"
  "3-4m":   "3-6m"
  "4-5m":   "3-6m"
  "5-6m":   "3-6m"
  "6-7m":   "6-12m"
  "7-8m":   "6-12m"
  "8-9m":   "6-12m"
  "9-10m":  "6-12m"
  "10-11m": "6-12m"
  "11-12m": "6-12m"
  "12-13m": "1-5y"
  "13-14m": "1-5y"
  "14-15m": "1-5y"
  "15-16m": "1-5y"
  "16-17m": "1-5y"
  "17-18m": "1-5y"
  "18-19m": "1-5y"
  "19-20m": "1-5y"
  "20-21m": "1-5y"
  "21-22m": "1-5y"
  "22-23m": "1-5y"
  "23-24m": "1-5y"
  "24-30m": "1-5y"
  "30-36m": "1-5y"
  "3-4y":   "1-5y"
