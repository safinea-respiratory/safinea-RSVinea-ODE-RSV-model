---
# Ireland-specific RSV model configuration for the RespiCompass 2025/2026 round.
# Covers RSV transmission in Ireland from Sep 2023 to Feb 2026 (n_days = 1000).
#
# All model parameters are initialised in default.yaml (fixed values or uncertainty
# distributions). This file provides Ireland-specific overrides: calibration prior
# bounds, data source settings, and vaccination parameters.
#
# Structure:
# - Simulation settings: time horizon and transmission rate
# - State durations and waning immunity
# - Social mixing (Irish contact matrix)
# - Calibration settings: prior bounds
# - Calibration options: data source, country, fitting period

# ---- Simulation settings ----

# Number of days to simulate
# This must be at least the sum of the burn-in period and the fitting dates
n_days: 1000

# Transmission rate at baseline susceptibility (defined as oldest age group) and seasonal maximum
# Per-season transmission rates (absolute, not scalars on a shared beta).
beta_A_s1: 0.0120 # season 1
beta_A_s2: 0.0108 # season 2 (was beta_A * season2_effect = 0.012 * 0.9)
beta_A_s3: 0.0108 # season 3 (was beta_A * season3_effect = 0.012 * 0.9)

# Seasonality profile
amplitude: 0.0 # 
peak_day: 68.37 

# ---- State durations ----
# Days from exposure to symptom onset for strain A 
gamma_A: 
  uncertainty:
    fn: "norm"  # Options: unif (min, max), norm (mean, sd), pois (lambda)
    mean: 7
    sd: 2

# ---- Mortality rate ----
p_death: 0.0 # Proportion of hospitalisations resulting in death

# ---- Rates of waning immunity ----
omega: 200  # Days to become susceptible again following infection (all infection-history tiers)
            # Placeholder: overridden because omega is fitted below.

# ---- Social mixing ----
# Countries to pull contact matrix data from
contact_matrix_countries: IRL  # ISO 3166-1 alpha-3 country codes (en.wikipedia.org/wiki/ISO_3166-1_alpha-3)

# ---- Calibration settings ----
calibration_parameters:
- param: "seasonality_exponent"
  lower: 0.5
  upper: 1.5
# Absolute P(hosp | infection) for each anchor band - NOT multipliers.
# Converted from the previous rel_hosp_*_A multipliers as
# [p_hosp_A_lower * rel_lower, p_hosp_A_upper * rel_upper], which is exactly
# the set of probabilities each band could reach before, so reachability is
# preserved while the bands are decoupled.
- param: "p_hosp_a_A"     # 0-3m   (was rel_hosp_a_A [80, 150])
  lower: 0.00800
  upper: 0.02500
- param: "p_hosp_b_A"     # 1-5y   (was rel_hosp_b_A [15, 40])
  lower: 0.00400
  upper: 0.00600
- param: "p_hosp_c_A"     # 65+y   (was rel_hosp_c_A [5, 18])
  lower: 0.00150
  upper: 0.00250
- param: "p_hosp_A"     # 5-65y only, now that the bands are decoupled
  lower: 0.000100
  upper: 0.000200
# Per-season transmission rates - absolute, NOT scalars on a shared beta.
# Converted from beta_A [0.050, 0.120] with season2/3_effect [0.7, 1.1] as
# [beta_lower * eff_lower, beta_upper * eff_upper], which is exactly the set
# of rates each season could reach before, so reachability is preserved.
- param: "beta_A_s1"    # season 1 (was beta_A, scalar pinned at 1.0)
  lower: 0.0700
  upper: 0.0850
- param: "beta_A_s2"    # season 2 (was beta_A x season2_effect)
  lower: 0.065
  upper: 0.075
- param: "beta_A_s3"    # season 3 (was beta_A x season3_effect)
  lower: 0.065
  upper: 0.075
- param: "init_inf"
  lower: 0.15
  upper: 0.25
- param: "omega"
  lower: 50
  upper: 300
- param: "k"
  lower: 10
  upper: 100
- param: "peak_day"
  lower: 110
  upper: 130
- param: "amplitude"
  lower: 0.15
  upper: 0.25

# Additional options for calibration
calibration_options:
 data_source:
    epi: "RESPICOMPASS"      # OPTIONS: 'RESPICOMPASS', 'USER-DEFINED'
 country: "IE"         # N.B. Cross-reference with contact matrix above
 data_end: 2026-05-16  # Last day in data (data runs to wk-start 2026-05-11, i.e. 2026-05-17
                       # after the +6 shift; cut at the 4-weekly burden period boundary so the
                       # final burden point is a true 4-week sum, not a partial one)
 data_days: 991        # Length of data for fitting (start unchanged at 2023-08-30)
 data_burn_in: 0       # Number of days to simulate before matching to data
 cases: "observed"     # data stream label
 hospital_admissions: "observed" # data stream label
 deaths: "observed"    # data stream label
  
# Time period for calibration
calibration_time_period: "day" # OPTIONS: "day", "week", "month", "quarter", "year"

# Weights for calibration (set metrics to 0 to turn off)
calibration_weights:
 metrics:
  cases: 0.0
  hospital_admissions: 1.0
  hospital_burden: 1.0
  hospital_beds: 0.0
  deaths: 0.0
  
