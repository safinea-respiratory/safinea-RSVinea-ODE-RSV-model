---
# Latvia-specific RSV model configuration for the RespiCompass 2026/2027 round.
# Covers RSV transmission in Latvia from Sep 2026, spanning the round's
# modelling period.
#
# All model parameters are initialised in default.yaml (fixed values or uncertainty
# distributions). This file provides Latvia-specific overrides: calibration prior
# bounds, data source settings, and vaccination parameters.
#
# Calibration prior bounds are carried over from the RespiCompass 2025/2026 round
# for this country. NB: p_hosp_c_A has been RESCALED for the new model, which
# multiplies it by the data-derived elderly_shape (normalised to 60-64y = 1.0):
#   p_hosp_c_A_new = p_hosp_c_A_old / shape_bar,  shape_bar(LV) = 7.613319
# where shape_bar is the 65+ hospitalisation rate relative to the 60-64y rate,
# computed from the RespiCompass burden and population data. Bounds are then
# widened by -25%/+25% since these priors come from a different model and season.
#
# Structure:
# - Simulation settings: time horizon and transmission rate
# - State durations and waning immunity
# - Social mixing (Latvia contact matrix)
# - Calibration settings: prior bounds
# - Calibration options: data source, country, fitting period

# ---- Simulation settings ----

# Number of days to simulate
# This must be at least the sum of the burn-in period and the fitting dates.
# Covers the RespiCompass 2026/2027 modelling period (2026-09-01 onwards).
n_days: 730

# Transmission rate at baseline susceptibility (defined as oldest age group) and seasonal maximum
beta_A: 0.012 # transmission rate

# Seasonality profile
amplitude: 0.0 #
peak_day: 68.37

# ---- State durations ----
# Days from exposure to symptom onset for strain A
gamma_A:
  uncertainty:
    fn: "norm"  # Options: unif (min, max), norm (mean, sd), pois (lambda)
    mean: 7
    sd: 2

# ---- Mortality rate ----
p_death: 0.0 # Proportion of hospitalisations resulting in death

# ---- Rates of waning immunity ----
omega: 200  # Mean days from recovery back to susceptible (R -> S).

# ---- Social mixing ----
# Countries to pull contact matrix data from
contact_matrix_countries: LVA  # ISO 3166-1 alpha-3 country codes (en.wikipedia.org/wiki/ISO_3166-1_alpha-3)

# ---- Adult vaccination ----
adult_vacc_coverage: 0.0

# ---- Background (non-RSV) mortality ----
# NOT SET HERE. Latvia's age-specific all-cause mortality is DERIVED AT RUNTIME
# from the RespiCompass mortality data (annual death counts) divided by the
# redistributed population — see compute_background_mortality() in auxiliary.R.
# Anything set here would simply be overwritten by that computation.
#
# !!! UNITS DISCLAIMER !!!
# The derived (and fallback) values are an ANNUAL per-capita mortality RATE
# (hazard, deaths per person-year), NOT an annual probability of death
# (life-table q_x). The model applies monthly survival = exp(-rate/12), spread
# uniformly across the year (flat monthly rate — no seasonality). If you ever
# hand-set rates, convert q_x probabilities first with rate = -ln(1 - q_x).
# The manual fallback vector + full explanation live in config/default.yaml, and
# are used only when a country is absent from the RespiCompass mortality data.

# ---- Calibration settings ----
calibration_parameters:
- param: "seasonality_exponent"
  lower: 0.5
  upper: 2.0
- param: "p_hosp_a_A"
  lower: 0.036
  upper: 0.076
- param: "p_hosp_b_A"
  lower: 0.00216
  upper: 0.0052
- param: "p_hosp_c_A"
  lower: 0.0001656
  upper: 0.000624
- param: "beta_A"
  lower: 0.065
  upper: 0.080
- param: "p_hosp_A"
  lower: 0.000025
  upper: 0.000055
- param: "init_inf"
  lower: 0.12
  upper: 0.30
- param: "omega"
  lower: 100
  upper: 300
- param: "peak_day"
  lower: 80
  upper: 140
- param: "amplitude"
  lower: 0.12
  upper: 0.24
# Observation-model over-dispersion (negative-binomial size; larger = less
# over-dispersed). Fitted rather than fixed, following the RSV literature.
# Range spans the defensible published values (Krauer fitted ~5.9; RKI fixed 50).
- param: "k"
  lower: 1
  upper: 100


# Additional options for calibration
calibration_options:
 data_source:
    epi: "RESPICOMPASS"      # OPTIONS: 'RESPICOMPASS', 'USER-DEFINED'
 country: "LV"         # N.B. Cross-reference with contact matrix above
 data_end: 2027-08-29  # Last day in data (end of RespiCompass 2026/27 reference season)
 data_days: 363        # Length of data for fitting (~one season; data_start = 2026-09-01)
 data_burn_in: 0       # Number of days to simulate before matching to data
 cases: "observed"     # data stream label
 hospital_admissions: "observed" # data stream label
 deaths: "observed"    # data stream label

# Time period for calibration
calibration_time_period: "day" # OPTIONS: "day", "week", "month", "quarter", "year"

# Weights for calibration (set metrics to 0 to turn off)
calibration_weights:
 metrics:
  cases: 0.0
  hospital_admissions: 1.0
  hospital_burden: 1.0
  hospital_beds: 0.0
  deaths: 0.0

